<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310B981'><circle cx='12' cy='12' r='10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceVoice AI - Face Recognition & Voice Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
    <script>
      // Fallback to local files if CDN fails or is blocked
      (function() {
        var base = (window.location.pathname.indexOf('/Strong-Care') !== -1) ? '/Strong-Care' : '';
        if (!window.FaceDetection) {
          var s1 = document.createElement('script');
          s1.src = base + '/mediapipe/face_detection/face_detection.js';
          document.head.appendChild(s1);
        }
        if (!window.Pose) {
          var s2 = document.createElement('script');
          s2.src = base + '/mediapipe/pose/pose.js';
          document.head.appendChild(s2);
        }
      })();
    </script>
  </head>
  <body class="bg-background text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
